<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<title>Sage</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #15181e;
    --panel-hover: #1c2028;
    --border: #262a33;
    --text: #e9e9e7;
    --muted: #8a8f98;
    --accent: #e2603a;
    --bubble-bot: #1c2028;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    font-family: "IBM Plex Sans", -apple-system, sans-serif;
    color: var(--text);
    display: flex;
  }

  #sidebar {
    width: 260px;
    flex-shrink: 0;
    height: 100vh;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 12px;
  }

  #sidebar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px 20px 8px;
    font-family: "Fraunces", serif;
    font-size: 20px;
    font-weight: 600;
  }

  #newChatBtn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-family: "IBM Plex Sans", sans-serif;
    cursor: pointer;
    margin-bottom: 18px;
  }
  #newChatBtn:hover { background: var(--panel-hover); }

  .side-section {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    padding: 0 8px;
    margin: 10px 0 8px 0;
  }

  .side-item {
    padding: 9px 8px;
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
  }

  .side-item.active {
    background: var(--panel-hover);
    color: var(--text);
  }

  #sidebar .foot {
    margin-top: auto;
    font-size: 12px;
    color: var(--muted);
    padding: 8px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  #main {
    flex: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg);
  }

  header {
    flex-shrink: 0;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 {
    font-family: "Fraunces", serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .status-pill {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }

  #chatbox {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  #chatInner {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  #welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
  }

  #welcome .icon {
    margin: 0 auto 20px auto;
  }

  #welcome h2 {
    font-family: "Fraunces", serif;
    font-size: 28px;
    margin: 0 0 8px 0;
    font-weight: 600;
  }

  #welcome p {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px 0;
  }

  .suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }

  .suggestion {
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-family: "IBM Plex Sans", sans-serif;
    cursor: pointer;
  }
  .suggestion:hover { background: var(--panel-hover); border-color: #3a3f4a; }

  .suggestion .t { display: block; font-weight: 500; margin-bottom: 2px; }
  .suggestion .d { color: var(--muted); font-size: 12px; }

  .row { display: flex; margin-bottom: 16px; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
  }

  .row.user .bubble {
    background: var(--accent);
    color: #fff7f2;
    border-bottom-right-radius: 4px;
  }

  .row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  #typing span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 2px;
    background: var(--muted);
    border-radius: 50%;
  }

  #inputBar {
    flex-shrink: 0;
    padding: 16px 16px 20px 16px;
    border-top: 1px solid var(--border);
  }

  #inputWrap {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 8px 8px 18px;
  }
  .bubble h1, .bubble h2, .bubble h3 { margin: 8px 0 4px 0; font-family: "Fraunces", serif; }
  .bubble p { margin: 0 0 8px 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
  .bubble code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble pre { background: rgba(255,255,255,0.06); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .bubble pre code { background: none; padding: 0; }

  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .copyBtn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
  }
  .copyBtn:hover { color: var(--text); }

  #userInput {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-size: 15px;
    font-family: "IBM Plex Sans", sans-serif;
    padding: 8px 0;
    max-height: 140px;
    background: transparent;
    color: var(--text);
  }

  #userInput::placeholder { color: var(--muted); }

  #sendBtn {
    background: var(--accent);
    color: #fff7f2;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #sendBtn:hover { opacity: 0.85; }
  #sendBtn:disabled { opacity: 0.35; cursor: default; }

  #chatbox::-webkit-scrollbar { width: 6px; }
  #chatbox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 700px) {
    #sidebar { display: none; }
    .suggestions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 120 120" style="flex-shrink:0;">
      <rect width="120" height="120" rx="28" fill="#e2603a"/>
      <path d="M60 30 C85 30 105 50 105 75 C105 95 90 108 72 110 L72 122 L58 108 C42 105 30 90 30 72 C30 48 48 30 60 30 Z" fill="#fff7f2"/>
      <path d="M60 35 C60 70 70 90 95 98" stroke="#e2603a" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    Sage
  </div>
  <button id="newChatBtn" onclick="newChat()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    New chat
  </button>
  <div class="side-section">Current session</div>
  <div class="side-item active">Sage conversation</div>
  <div class="foot">Memory resets on New chat</div>
</div>

<div id="main">
  <header>
    <h1>Sage</h1>
    <span class="status-pill">Session memory active</span>
  </header>

  <div id="chatbox">
    <div id="welcome">
      <div class="icon">
        <svg width="52" height="52" viewBox="0 0 120 120">
          <rect width="120" height="120" rx="28" fill="#e2603a"/>
          <path d="M60 30 C85 30 105 50 105 75 C105 95 90 108 72 110 L72 122 L58 108 C42 105 30 90 30 72 C30 48 48 30 60 30 Z" fill="#fff7f2"/>
          <path d="M60 35 C60 70 70 90 95 98" stroke="#e2603a" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>Hey, I'm Sage</h2>
      <p>I remember everything we talk about in this session. Ask me anything.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="fillAndSend('Explain how you remember our conversation')">
          <span class="t">How do you remember?</span>
          <span class="d">Ask about my memory</span>
        </button>
        <button class="suggestion" onclick="fillAndSend('Write a short poem about the ocean')">
          <span class="t">Write something</span>
          <span class="d">A poem, story, or idea</span>
        </button>
        <button class="suggestion" onclick="fillAndSend('Help me plan my day')">
          <span class="t">Plan my day</span>
          <span class="d">Get organized</span>
        </button>
        <button class="suggestion" onclick="fillAndSend('Explain a concept simply')">
          <span class="t">Explain something</span>
          <span class="d">Break down a topic</span>
        </button>
      </div>
    </div>
    <div id="chatInner" style="display:none;"></div>
  </div>

  <div id="inputBar">
    <div id="inputWrap">
      <textarea id="userInput" rows="1" placeholder="Message Sage..."></textarea>
      <button id="sendBtn" onclick="sendMessage()" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  const chatbox = document.getElementById("chatbox");
  const chatInner = document.getElementById("chatInner");
  const welcome = document.getElementById("welcome");
  const input = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function fillAndSend(text) {
    input.value = text;
    sendMessage();
  }

  function removeWelcome() {
    if (welcome.style.display !== "none") {
      welcome.style.display = "none";
      chatInner.style.display = "block";
    }
  }

  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "bot");

    const col = document.createElement("div");
    col.style.maxWidth = "78%";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (role === "user") {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = marked.parse(text);
    }

    col.appendChild(bubble);

    const meta = document.createElement("div");
    meta.className = "meta";
    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    if (role === "bot") {
      meta.innerHTML = `<span>${time}</span><button class="copyBtn" title="Copy"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4C3.44772 15 3 14.5523 3 14V4C3 3.44772 3.44772 3 4 3H14C14.5523 3 15 3.44772 15 4V5" stroke="currentColor" stroke-width="2"/></svg></button>`;
      col.appendChild(meta);
      col.querySelector(".copyBtn").onclick = () => {
        navigator.clipboard.writeText(text);
        const btn = col.querySelector(".copyBtn");
        const original = btn.innerHTML;
        btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13L9 17L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        setTimeout(() => (btn.innerHTML = original), 1200);
      };
    } else {
      meta.innerHTML = `<span>${time}</span>`;
      meta.style.textAlign = "right";
      col.appendChild(meta);
    }

    row.appendChild(col);
    chatInner.appendChild(row);
    chatbox.scrollTop = chatbox.scrollHeight;
  }
  function showTyping() {
    const el = document.createElement("div");
    el.id = "typingRow";
    el.className = "row bot";
    el.innerHTML = `<div id="typing" class="bubble"><span></span><span></span><span></span></div>`;
    chatInner.appendChild(el);
    chatbox.scrollTop = chatbox.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typingRow");
    if (el) el.remove();
  }

  async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    removeWelcome();
    addBubble("user", message);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      const data = await response.json();
      hideTyping();

      if (data.error) {
        addBubble("bot", "Something went wrong: " + data.error);
      } else {
        addBubble("bot", data.reply);
      }
    } catch (err) {
      hideTyping();
      addBubble("bot", "Connection error. Is the server still running?");
    }

    sendBtn.disabled = false;
    input.focus();
  }

  async function newChat() {
    await fetch("/reset", { method: "POST" });
    chatInner.innerHTML = "";
    chatInner.style.display = "none";
    welcome.style.display = "flex";
  }
</script>

</body>
</html>
